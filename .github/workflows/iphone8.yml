name: Live Interactive iPhone 8
on:
  workflow_dispatch:

jobs:
  live-iphone:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Enable VNC, Wake Display & Boot iPhone
        run: |
          set +e
          # Set macOS user password properly via sysadminctl & dscl
          sudo sysadminctl -resetPasswordFor runner -newPassword "test1234"
          sudo dscl . -passwd /Users/runner "test1234"
          
          # Enable standard VNC access without Apple proprietary encryption
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCAlwaysStartOnConsole -bool true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users runner -privs -all -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw "test1234" -restart -agent
          
          caffeinate -u -t 3600 &
          osascript -e 'tell application "System Events" to key code 49'
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 8 \(|iPhone SE \(3rd generation\)" | head -n 1 | awk -F '[()]' '{print $(NF-1)}')
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: Start Browser VNC (noVNC) + Cloudflare Tunnel
        run: |
          brew install cloudflared
          GH="https://github.com"
          git clone --depth 1 "$GH/novnc/noVNC.git"
          git clone --depth 1 "$GH/novnc/websockify.git" noVNC/utils/websockify
          ./noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080 > novnc.log 2>&1 &
          cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          sleep 10
          echo "=========================================="
          echo "OPEN THIS LINK IN YOUR BROWSER:"
          grep -o "https://[a-zA-Z0-9-]*\.trycloudflare\.com" tunnel.log | head -n 1
          echo "ADD /vnc.html AT THE END OF THE URL!"
          echo "USERNAME: runner | PASSWORD: test1234"
          echo "=========================================="
          sleep 3500
